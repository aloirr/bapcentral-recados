name: Recado
description: Recado do Alexandre para o time BAP Tools. Vira um arquivo em recados/<destino>/ e a issue é fechada com o link.
title: "[Recado] "
body:
  - type: markdown
    attributes:
      value: |
        O **título** da issue é o assunto do recado. Só vale para issue aberta pelas contas domontecristo ou aloirr; de outra conta, nada acontece.
        O recado chega na hora à caixa do destino (o time lê direto do GitHub). Na dúvida, mande para o **po** ou para o **gerente-projetos**.
  - type: dropdown
    id: para
    attributes:
      label: Para
      multiple: true
      options:
        - gerente-projetos
        - po
        - engenheiro-software
        - engenheiro-dados
        - modulo-robo
        - modulo-farois
        - modulo-posvenda
        - modulo-rota
        - modulo-metas
        - modulo-web
        - testes
        - revisor-codigo
        - todos
      default: 1
    validations:
      required: true
  - type: dropdown
    id: cc
    attributes:
      label: Cópia (cc)
      multiple: true
      options:
        - gerente-projetos
        - po
        - engenheiro-software
        - engenheiro-dados
        - modulo-robo
        - modulo-farois
        - modulo-posvenda
        - modulo-rota
        - modulo-metas
        - modulo-web
        - testes
        - revisor-codigo
        - todos
    validations:
      required: false
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo
      options:
        - pedido
        - aviso
        - pergunta
        - resposta
        - bloqueio
        - revisao
        - entrega
      default: 0
    validations:
      required: true
  - type: dropdown
    id: prioridade
    attributes:
      label: Prioridade
      options:
        - normal
        - alta
        - baixa
      default: 0
    validations:
      required: true
  - type: input
    id: tarefa
    attributes:
      label: Tarefa
      description: Opcional. Formato T-0000.
      placeholder: T-0001
    validations:
      required: false
  - type: input
    id: responde_a
    attributes:
      label: Responde a
      description: Opcional. Id do recado que esta mensagem responde (R-AAAAMMDD-HHMMSS-remetente).
      placeholder: R-20261120-080000-po
    validations:
      required: false
  - type: checkboxes
    id: encerra
    attributes:
      label: Encerra o assunto
      description: Só numa resposta (preencha "Responde a").
      options:
        - label: Sim, este recado encerra o assunto
          required: false
  - type: textarea
    id: texto
    attributes:
      label: Texto
      description: O corpo do recado. Para pedido, use Contexto / O que preciso / Pronto quando.
      placeholder: |
        ## Contexto
        ...
        ## O que preciso
        ...
        ## Pronto quando
        ...
    validations:
      required: true
